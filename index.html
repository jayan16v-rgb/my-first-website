<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #172554;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 12px;
            text-decoration: none;
        }

        header {
            text-align: center;
            padding: 65px 20px;
            background: #dbeafe;
        }

        header h1 {
            font-size: 40px;
            color: #1d4ed8;
        }

        button {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        section {
            max-width: 700px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #172554;
            color: white;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <header id="home">
        <h1>Welcome to My Website!</h1>
        <p>This is my very own website, built with HTML and CSS.</p>
        <button onclick="alert('Thanks for visiting!')">
            Click Me
        </button>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I'm learning how to build websites.
           This is where I can tell visitors about myself.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: hello@example.com</p>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>
</body>
</html>
